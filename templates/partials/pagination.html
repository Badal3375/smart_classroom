{% load core_extras %}{% if page.paginator.num_pages > 1 %}
<nav><ul class="pagination pagination-sm justify-content-center mb-0 mt-3">
{% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% qs_without_page %}&page={{ page.previous_page_number }}">&laquo;</a></li>{% endif %}
<li class="page-item disabled"><span class="page-link">Page {{ page.number }} of {{ page.paginator.num_pages }}</span></li>
{% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% qs_without_page %}&page={{ page.next_page_number }}">&raquo;</a></li>{% endif %}
</ul></nav>{% endif %}
